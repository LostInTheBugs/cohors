name: Release
on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]"
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]-c*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v t="$TAG" 'index($0, t) && /^#/ {f=1; print; next} /^#+ *\[?20[0-9][0-9]\./ {if (f) exit} f {print}' CHANGELOG.md > /tmp/notes.md
          fi
          [ -s /tmp/notes.md ] || echo "Release $TAG" > /tmp/notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true
