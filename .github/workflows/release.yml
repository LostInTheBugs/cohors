name: Release
on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]"
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]-c*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v t="$TAG" 'index($0, t) && /^#/ {f=1; print; next} /^#+ *\[?20[0-9][0-9]\./ {if (f) exit} f {print}' CHANGELOG.md > /tmp/notes.md
          fi
          [ -s /tmp/notes.md ] || echo "Release $TAG" > /tmp/notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true
