name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked, hash-checked)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest
      - name: Install lua5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Add-on harness (offline, lua5.1, sans os/io)
        run: |
          for sc in full calendar apifail noprofs slash legacy openbtn noapi closemid unreadable logout wishlist loot; do COHORS_SCENARIO=$sc lua5.1 tools/addon-harness.lua | tail -1; done
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Page JavaScript — syntax (node --check)
        run: python3 tools/check-inline-js.py
      - name: Page JavaScript — undeclared / used-before-defined (ESLint)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund eslint@9 globals@15
          node tools/lint-js.mjs
