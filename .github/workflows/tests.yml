name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Install lua5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Add-on harness (offline, lua5.1, sans os/io)
        run: |
          for sc in full calendar apifail noprofs slash legacy openbtn noapi closemid unreadable logout wishlist; do COHORS_SCENARIO=$sc lua5.1 tools/addon-harness.lua | tail -1; done
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Page JavaScript — syntax (node --check)
        run: python3 tools/check-inline-js.py
      - name: Page JavaScript — undeclared / used-before-defined (ESLint)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund eslint@9 globals@15
          node tools/lint-js.mjs
