<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cohors — Mains & alts</title>
<link rel="icon" href="/branding/logo">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b1002e">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cohors">
<style>
  :root { --bg:#0b0f17; --card:#131a26; --card2:#182130; --line:#2a3446; --fg:#e8edf7; --mut:#8b96ad;
          --acc:#b1002e; --acc2:#dfa55a; --ok:#38c98e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 18px 40px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .brand { display:flex; gap:12px; align-items:center; }
  .crest { width:44px; height:44px; border-radius:9px; }
  .brandname { font-size:19px; font-weight:700; letter-spacing:.2px; }
  .brandname span { color:var(--acc2); }
  .tagline { color:var(--mut); font-size:12.5px; }
  .userbox { display:flex; gap:14px; align-items:center; }
  .who { color:var(--acc2); font-weight:600; font-size:14px; }
  .hlink { color:var(--acc2); text-decoration:none; font-size:14px; font-weight:600; }
  .hlink:hover { text-decoration:underline; }
  nav.tabs { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 14px; }
  .tab { display:inline-flex; align-items:center; gap:7px; padding:8px 16px; border-radius:999px;
         color:var(--mut); text-decoration:none; font-weight:600; font-size:14px; line-height:1.55;
         border:1px solid var(--line); background:transparent;
         transition:border-color .15s, color .15s, background .15s; }
  .tab:hover { color:var(--fg); border-color:#3a4763; }
  .tab.active { color:#fff; background:linear-gradient(135deg, var(--acc), #7d0020); border-color:transparent; }
  .tab.admin { margin-left:auto; color:var(--acc2); border-color:#5e4a1e; }
  .tab.admin:hover { background:#241d10; color:var(--acc2); border-color:var(--acc2); }
  .tab.admin.active { background:linear-gradient(135deg, #b8862e, #7a5312); color:#fff; }
  h2 { font-size:17px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .spacer { flex:1; }
  .meta { color:var(--mut); font-size:12.5px; }
  input[type=text] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:10px;
        padding:9px 12px; font-size:14px; flex:1; min-width:220px; }
  input:focus { outline:2px solid var(--acc); border-color:var(--acc); }
  .accrow { border:1px solid var(--line); background:var(--card2); border-radius:12px; padding:12px 14px; margin-bottom:9px;
            cursor:pointer; transition:border-color .15s, background .15s; }
  .accrow:hover { border-color:#5a4a2a; background:#1b2537; }
  .acchead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .accname { color:var(--acc2); font-weight:700; font-size:15px; text-decoration:none; }
  .accname:hover { text-decoration:underline; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px;
          padding:5px 13px; font-size:13.5px; color:var(--fg); text-decoration:none; }
  .chip:hover { border-color:var(--acc2); color:var(--acc2); }
  .chip .realm { color:var(--mut); font-size:11.5px; }
  .chip.main { border-color:#7a5b2e; background:rgba(223,165,90,.08); font-weight:600; }
  .chip.main .star { color:var(--acc2); }
  .nommain { color:var(--mut); font-size:12px; font-style:italic; }
  .empty { color:var(--mut); font-size:14px; }
  footer { color:var(--mut); font-size:12.5px; border-top:1px solid var(--line); margin-top:20px; padding-top:12px; }
</style>
<link rel="stylesheet" href="/static/theme.css?v=2026.09.141">
</head>
<body class="wb">
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/dashboard" title="Tableau de bord" style="text-decoration:none;color:inherit">
      <img src="/branding/logo" alt="Cohors" class="crest">
      <div>
        <div class="brandname">Cohors <span>Mains &amp; alts</span></div>
        <div class="tagline">Tous les personnages de la guilde, regroupés sous leur main.</div>
      </div>
    </a>
    <div class="userbox">
      <span class="who" id="who"></span>
      <a class="hlink" href="/characters">👥 Mes personnages</a>
      <a class="hlink" href="#" id="logout">Déconnexion</a>
    </div>
  </header>
  <nav class="tabs" id="navmain"></nav>

  <div class="card">
    <h2>⭐ Mains &amp; alts <span class="meta" id="count"></span></h2>
    <div class="meta" style="margin:-4px 0 12px">Clique sur le cadre d'un compte pour ouvrir la fiche de son main, ou sur un personnage pour la sienne.</div>
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="q" placeholder="Rechercher un personnage ou un joueur…">
    </div>
    <div id="list"><div class="empty">Chargement…</div></div>
  </div>

  <footer><span id="ver"></span> · Outil non affilié à Blizzard Entertainment</footer>
</div>
<div id="toast"></div>
<script src="/static/nav.js?v=2026.09.141"></script>
<script src="/static/branding.js?v=2026.09.141"></script>
<script src="/static/i18n.js?v=2026.09.141"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const plur = (n, s) => `${n} ${s}${n > 1 ? "s" : ""}`;
let DATA = [];

async function load() {
  try {
    const r = await fetch("/api/mains");
    if (r.status === 401) { location.href = "/login"; return; }
    const d = await r.json();
    DATA = d.accounts || [];
    $("#count").textContent = `· ${plur(d.total_accounts, "compte")} · ${plur(d.total_chars, "personnage")}`;
    render();
  } catch (e) {
    $("#list").innerHTML = '<div class="empty">Impossible de charger la liste.</div>';
  }
}

const charUrl = (c) => `/char/${encodeURIComponent(c.realm)}/${encodeURIComponent(c.name)}`;

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const list = $("#list");
  const accs = DATA.filter(a => !q || a.user.toLowerCase().includes(q) ||
    a.chars.some(c => (c.display || c.name).toLowerCase().includes(q)));
  if (!accs.length) { list.innerHTML = '<div class="empty">Aucun personnage lié pour le moment.</div>'; return; }
  list.innerHTML = accs.map(a => {
    const hasMain = a.chars.some(c => c.main);
    const main = a.chars.find(c => c.main) || a.chars[0];
    const chips = a.chars.map(c =>
      `<a class="chip${c.main ? " main" : ""}" href="${charUrl(c)}">${c.main ? '<span class="star">⭐</span>' : ""}${esc(c.display || c.name)} <span class="realm">${esc(c.realm)}</span></a>`
    ).join("");
    return `<div class="accrow" data-href="${charUrl(main)}">
      <div class="acchead"><a class="accname" href="${charUrl(main)}">${esc(a.user)}</a>
        <span class="meta">${plur(a.chars.length, "personnage")}</span>${hasMain ? "" : ' <span class="nommain">aucun main défini</span>'}</div>
      <div class="chips">${chips}</div></div>`;
  }).join("");
}

$("#list").addEventListener("click", (ev) => {
  if (ev.target.closest("a")) return;
  const row = ev.target.closest(".accrow");
  if (row && row.dataset.href) location.href = row.dataset.href;
});

$("#q").addEventListener("input", render);
$("#logout").addEventListener("click", async (ev) => { ev.preventDefault(); await fetch("/api/logout", { method: "POST" }); location.href = "/login"; });

(async () => {
  try { const me = await (await fetch("/api/me")).json(); $("#who").textContent = me.name || ""; } catch (e) {}
  try { const h = await (await fetch("/api/health")).json(); $("#ver").textContent = "v" + h.version; } catch (e) {}
  load();
})();
</script>
</body>
</html>
