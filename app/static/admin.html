<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTP — Administration</title>
<style>
  :root { --bg:#0b0e14; --card:#131a26; --card2:#1a2233; --line:#232d42; --fg:#e7ebf5; --mut:#8c96ad;
          --acc:#7c6cf6; --acc2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:28px 18px 40px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:24px; margin:0; }
  h1 span { color:var(--acc2); }
  h2 { font-size:17px; margin:0 0 12px; }
  .sub { color:var(--mut); font-size:14px; margin:0 0 20px; }
  .spacer { flex:1; }
  .hlink { color:var(--acc2); text-decoration:none; font-size:14px; font-weight:600; }
  .hlink:hover { text-decoration:underline; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  input[type=email], input[type=text] { background:var(--bg); color:var(--fg); border:1px solid var(--line);
        border-radius:10px; padding:9px 12px; font-size:14px; }
  input:focus { outline:2px solid var(--acc); border-color:var(--acc); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { background:linear-gradient(135deg,var(--acc),#5b4bd6); color:#fff; border:0; border-radius:10px;
           padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  button.small { padding:5px 12px; font-size:12.5px; font-weight:500; border-radius:8px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.danger { background:transparent; border:1px solid #5a2626; color:var(--err); }
  .item { border:1px solid var(--line); background:var(--card2); border-radius:11px; padding:11px 14px;
          margin-bottom:9px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .item .main { display:flex; flex-direction:column; min-width:200px; }
  .item .name { font-weight:600; }
  .item .meta { color:var(--mut); font-size:12.5px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--mut); white-space:nowrap; }
  .b-pending { color:var(--warn); border-color:#5a4a12; }
  .b-used { color:var(--ok); border-color:#1d4a3a; }
  .b-expired { color:var(--mut); }
  .b-admin { color:var(--acc2); border-color:#3d3470; }
  .b-off { color:var(--err); border-color:#5a2626; }
  .linkbox { margin-top:14px; background:var(--card2); border:1px dashed var(--acc); border-radius:10px; padding:12px 14px; }
  .linkbox code { user-select:all; word-break:break-all; font-size:13px; color:var(--acc2); }
  .empty { color:var(--mut); font-size:14px; }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--card2);
           border:1px solid var(--acc); color:var(--fg); border-radius:10px; padding:9px 18px; font-size:14px;
           opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
  .hidden { display:none !important; }
  footer { color:var(--mut); font-size:12.5px; border-top:1px solid var(--line); margin-top:26px; padding-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LOTP <span>Administration</span></h1>
    <span class="spacer"></span>
    <a class="hlink" href="/">← Retour au simulateur</a>
  </header>
  <p class="sub">Invitations et gestion des comptes.</p>

  <div class="card">
    <h2>Créer une invitation</h2>
    <div class="row">
      <input type="email" id="inv-email" placeholder="e-mail du membre (vide = lien libre)" style="min-width:300px">
      <input type="text" id="inv-note" placeholder="note (optionnelle)" maxlength="120" style="min-width:180px">
      <button id="inv-create">Créer le lien</button>
    </div>
    <div id="inv-result" class="linkbox hidden"></div>
  </div>

  <div class="card">
    <h2>Invitations</h2>
    <div id="invites"><div class="empty">Chargement…</div></div>
  </div>

  <div class="card">
    <h2>Comptes</h2>
    <div id="users"><div class="empty">Chargement…</div></div>
  </div>

  <footer><span id="ver"></span> · Moteur : SimulationCraft · Outil non affilié à Blizzard Entertainment</footer>
</div>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const ago = (ts) => { if (!ts) return "jamais"; const s = Math.max(0, Date.now()/1000 - ts);
  if (s < 60) return "à l'instant"; if (s < 3600) return `il y a ${Math.floor(s/60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s/3600)} h`; return `il y a ${Math.floor(s/86400)} j`; };
const onDate = (ts) => new Date(ts * 1000).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });

let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copié ✓"); }
  catch (e) { window.prompt("Copie le lien :", text); }
}
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { location.href = "/login"; throw new Error("auth"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.detail || "Erreur"); throw new Error(d.detail || "http"); }
  return d;
}

function showLink(text) {
  $("#inv-result").classList.remove("hidden");
  $("#inv-result").innerHTML = `Lien à envoyer :<br><code>${esc(text)}</code> <button class="small" id="copy-now">Copier</button>`;
  $("#copy-now").addEventListener("click", () => copy(text));
}

async function loadInvites() {
  const d = await api("GET", "/api/admin/invites");
  const box = $("#invites");
  if (!d.invites.length) { box.innerHTML = '<div class="empty">Aucune invitation.</div>'; return; }
  const BADGE = { pending: ["En attente", "b-pending"], used: ["Utilisé", "b-used"], expired: ["Expiré", "b-expired"] };
  box.innerHTML = d.invites.map(v => {
    const [txt, cls] = BADGE[v.status];
    const info = v.status === "used" ? `utilisé` : v.status === "expired" ? `expiré le ${onDate(v.expires)}` : `expire le ${onDate(v.expires)}`;
    const actions = v.status === "pending"
      ? `<button class="small ghost" data-copy="${esc(v.link)}">Copier le lien</button>
         <button class="small danger" data-revoke="${esc(v.token)}">Révoquer</button>` : "";
    return `<div class="item">
      <div class="main"><span class="name">${esc(v.email || "(lien libre)")}</span>
      <span class="meta">${esc(v.note || "")}${v.note ? " · " : ""}cr\u00e9\u00e9 ${ago(v.created)} \u00b7 ${info}</span></div>
      <span class="badge ${cls}">${txt}</span><span class="spacer"></span>${actions}</div>`;
  }).join("");
  box.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy(b.dataset.copy)));
  box.querySelectorAll("[data-revoke]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Révoquer cette invitation ?")) return;
    await api("DELETE", "/api/admin/invites/" + b.dataset.revoke); toast("Invitation révoquée"); loadInvites();
  }));
}

async function loadUsers() {
  const d = await api("GET", "/api/admin/users");
  const box = $("#users");
  box.innerHTML = d.users.map(u => {
    const badges = (u.is_admin ? '<span class="badge b-admin">Admin</span> ' : '') +
                   (u.active ? '' : '<span class="badge b-off">Désactivé</span>');
    const btnActive = `<button class="small ghost" data-active="${u.id}" data-val="${u.active ? 0 : 1}">${u.active ? "Désactiver" : "Réactiver"}</button>`;
    const btnReset = `<button class="small ghost" data-reset="${u.id}">Lien de réinitialisation</button>`;
    const btnDel = `<button class="small danger" data-del="${u.id}" data-name="${esc(u.name)}">Supprimer</button>`;
    return `<div class="item">
      <div class="main"><span class="name">${esc(u.name || u.email)} ${badges}</span>
      <span class="meta">${esc(u.email)} · créé le ${onDate(u.created)} · dernière connexion ${ago(u.last_login)} · ${u.sims_count} sim(s)</span></div>
      <span class="spacer"></span>${btnActive} ${btnReset} ${btnDel}</div>`;
  }).join("");
  box.querySelectorAll("[data-active]").forEach(b => b.addEventListener("click", async () => {
    await api("POST", `/api/admin/users/${b.dataset.active}/active`, { active: b.dataset.val === "1" });
    toast("Compte mis à jour"); loadUsers();
  }));
  box.querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", async () => {
    const d2 = await api("POST", `/api/admin/users/${b.dataset.reset}/reset-link`);
    showLink(d2.link); toast("Lien de réinitialisation créé");
  }));
  box.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm(`Supprimer définitivement le compte « ${b.dataset.name} » ?`)) return;
    await api("DELETE", "/api/admin/users/" + b.dataset.del); toast("Compte supprimé"); loadUsers();
  }));
}

$("#inv-create").addEventListener("click", async () => {
  $("#inv-create").disabled = true;
  try {
    const d = await api("POST", "/api/admin/invites", { email: $("#inv-email").value.trim(), note: $("#inv-note").value.trim() });
    showLink(d.link); toast("Invitation créée");
    $("#inv-email").value = ""; $("#inv-note").value = "";
    loadInvites();
  } catch (e) {}
  $("#inv-create").disabled = false;
});

(async () => {
  try {
    const me = await api("GET", "/api/me");
    if (!me.is_admin) { location.href = "/"; return; }
    document.title = `LOTP — Admin (${me.name})`;
  } catch (e) { return; }
  const h = await api("GET", "/api/health").catch(() => null);
  if (h) $("#ver").textContent = "v" + h.version;
  loadInvites(); loadUsers();
})();
</script>
</body>
</html>
