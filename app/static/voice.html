<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOTP — Vocal</title>
<link rel="icon" type="image/png" href="/static/crest.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b1002e">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOTP">
<style>
  :root { --bg:#0b0f17; --card:#131a26; --card2:#182130; --line:#2a3446; --fg:#e8edf7; --mut:#8b96ad;
          --acc:#b1002e; --acc2:#dfa55a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  #shell { display:flex; height:100vh; }
  #side { display:flex; flex-direction:column; width:432px; min-width:320px; max-width:48vw;
          background:var(--card); border-right:1px solid var(--line); }
  #sidehead { display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--line); }
  .sidetitle { font-weight:700; font-size:13.5px; letter-spacing:.3px; }
  .sidebtn { margin-left:auto; color:var(--acc2); text-decoration:none; font-size:14px; font-weight:700;
             border:1px solid var(--line); border-radius:8px; padding:3px 10px; }
  .sidebtn:hover { border-color:var(--acc2); }
  #vframe { flex:1; width:100%; border:0; background:#0b0f17; }
  #sidefoot { display:flex; align-items:center; gap:8px; padding:6px 10px; border-top:1px solid var(--line);
              font-size:12px; color:var(--mut); white-space:nowrap; }
  #sidefoot a { color:var(--acc2); text-decoration:none; font-weight:600; }
  #sidefoot a:hover { text-decoration:underline; }
  #mainwrap { flex:1; min-width:0; display:flex; background:var(--bg); }
  #mainframe { flex:1; width:100%; border:0; }
  body.side-hidden #side { display:none; }
  #reopen { position:fixed; right:16px; bottom:16px; z-index:220; width:46px; height:46px; border-radius:50%;
            border:1px solid var(--line); background:var(--card2); color:var(--fg); font-size:20px; cursor:pointer;
            box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #reopen:hover { border-color:var(--acc2); }
  @media (max-width: 940px) {
    #side { position:fixed; top:0; bottom:0; left:0; z-index:210; width:min(92vw, 400px); max-width:none;
            border-right:0; box-shadow:0 0 44px rgba(0,0,0,.65); }
  }
</style>
<link rel="stylesheet" href="/static/theme.css?v=2026.09.062">
</head>
<body class="wb">
<div id="shell">
  <aside id="side">
    <div id="sidehead">
      <span class="sidetitle">🎧 Vocal</span>
      <a class="sidebtn" href="/dashboard" id="exit" title="Quitter le mode panneau vocal">⇱</a>
    </div>
    <iframe id="vframe" src="about:blank" allow="microphone; autoplay" title="WebSpeak — client web TeamSpeak"></iframe>
    <div id="sidefoot">
      <a href="/api/voice/client" id="dlclient">📦 Client portable</a>
      <span>·</span>
      <a href="/guild">🛡️ Infos &amp; liens</a>
    </div>
  </aside>
  <main id="mainwrap">
    <iframe id="mainframe" name="lotp-main" src="/dashboard" title="LOTP — application"></iframe>
  </main>
  <button id="reopen" hidden title="Afficher le panneau vocal">🎧</button>
</div>
<script src="/static/i18n.js?v=2026.09.062"></script>
<script>
(function () {
  if (window.self !== window.top) { location.replace("/dashboard"); return; }
  var $ = function (s) { return document.querySelector(s); };
  var narrow = function () { return window.matchMedia("(max-width: 940px)").matches; };
  function setPanel(open) {
    document.body.classList.toggle("side-hidden", !open);
    $("#reopen").hidden = open;
  }
  setPanel(!narrow());
  $("#reopen").addEventListener("click", function () { setPanel(true); });
  window.addEventListener("message", function (ev) {
    if (ev.origin !== location.origin) return;
    if (ev.data && ev.data.type === "lotp-voice-toggle") {
      setPanel(document.body.classList.contains("side-hidden"));
    }
  });
  fetch("/api/voice/handoff?json=1").catch(function () {}).then(function () {
    return fetch("/api/me").then(function (r) { return r.ok ? r.json() : null; });
  }).then(function (me) {
    var nick = me && (me.voice_nick || "").trim();
    $("#vframe").src = "https://ts.gensbien.fr/" + (nick ? "#nickname=" + encodeURIComponent(nick) + "&autojoin=1" : "#autojoin=1");
  }).catch(function () {
    $("#vframe").src = "https://ts.gensbien.fr/#autojoin=1";
  });
})();
</script>
</body>
</html>
