<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTP — Préparation de raid</title>
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="/static/icon-192.png">
<style>
  :root {
    --bg: #0b0e14; --card: #131a26; --card2: #1a2233; --line: #232d42;
    --fg: #e7ebf5; --mut: #8c96ad; --acc: #b1002e; --acc2: #dfa55a;
    --ok: #34d399; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 18px 40px; }
  header.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brandname { font-size: 22px; font-weight: 700; letter-spacing: .3px; line-height: 1.2; }
  .brandname span { color: var(--acc2); }
  .crest { width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0; }
  .tagline { color: var(--mut); font-size: 12.5px; }
  .userbox { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .spacer { flex: 1; }
  .hlink { color: var(--acc2); text-decoration: none; font-size: 14px; font-weight: 600; }
  .hlink:hover { text-decoration: underline; }
  .who { color: var(--mut); font-size: 14px; }
  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
  .tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 999px;
         color: var(--mut); text-decoration: none; font-weight: 600; font-size: 14px;
         border: 1px solid var(--line); background: transparent;
         transition: border-color .15s, color .15s, background .15s; }
  .tab:hover { color: var(--fg); border-color: #3a4763; }
  .tab.active { color: #fff; background: linear-gradient(135deg, var(--acc), #7d0020); border-color: transparent; }
  .tab.admin { margin-left: auto; color: var(--acc2); border-color: #5e4a1e; }
  .tab.admin:hover { background: #241d10; color: var(--acc2); border-color: var(--acc2); }
  .tab.admin.active { background: linear-gradient(135deg, #b8862e, #7a5312); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
        border-radius: 10px; padding: 8px 11px; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--acc); border-color: var(--acc); }
  h2 { font-size: 17px; margin: 0 0 10px; }
  h2 .pc { color: var(--mut); font-weight: 500; font-size: 13px; }
  .meta { color: var(--mut); font-size: 13px; }
  .empty { color: var(--mut); font-size: 14px; padding: 8px 2px; }
  .btn { background: linear-gradient(135deg, var(--acc), #7d0020); color: #fff; border: 0; border-radius: 10px;
         padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .irow, .nrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 7px 2px;
                 border-top: 1px solid var(--line); font-size: 14px; }
  .irow:first-child, .nrow:first-child { border-top: 0; }
  .iname { font-weight: 600; }
  .qty { font-weight: 700; color: var(--acc2); font-variant-numeric: tabular-nums; }
  .nmat { font-weight: 600; min-width: 120px; }
  .nneed { color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nclaimed { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nclaimed.ok { color: var(--ok); font-weight: 600; }
  .nclaimed.warn { color: var(--warn); }
  .nclaims { color: var(--mut); font-size: 12.5px; flex: 1 1 140px; }
  .napport { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .napport input { width: 84px; padding: 6px 8px; }
  .napport button { padding: 6px 11px; font-size: 13px; }
  .nbank { display: inline-flex; align-items: center; gap: 4px; color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nbank input { width: 66px; padding: 5px 7px; }
  .nrest { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--mut); font-size: 13px; }
  .nrest.ok { color: var(--ok); font-weight: 600; }
  .oqty { width: 76px; padding: 5px 7px; }
  #inewprev { min-height: 17px; }
  .combo { position: relative; flex: 1 1 320px; max-width: 460px; }
  .combo input { width: 100%; }
  .inlist { position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 300px; overflow-y: auto;
            background: var(--card2); border: 1px solid var(--line); border-radius: 10px; z-index: 40;
            box-shadow: 0 10px 26px rgba(0,0,0,.45); }
  .inrow { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid rgba(35,45,66,.55); }
  .inrow:last-child { border-bottom: 0; }
  .inrow:hover, .inrow.sel { background: rgba(223,165,90,.10); }
  .inrow .im { font-weight: 600; }
  .inrow .meta { font-size: 12.5px; }
  .inhint { padding: 8px 10px; color: var(--mut); font-size: 13px; }
  .chkline { display: inline-flex; align-items: center; gap: 7px; color: var(--mut); font-size: 13px; cursor: pointer; margin-top: 6px; }
  .chkline input[type=checkbox] { accent-color: var(--acc2); width: 15px; height: 15px; }
  .bar { flex: 1 1 100%; height: 5px; border-radius: 3px; background: var(--card2); overflow: hidden; margin-top: 2px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; max-width: 100%; }
  .chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px;
          padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--mut); }
  .chip:hover { border-color: var(--acc2); }
  .chip.on { border-color: var(--acc2); color: var(--acc2); font-weight: 600; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .mic { background: transparent; border: 0; color: var(--mut); cursor: pointer; font-size: 15px; padding: 4px 6px; }
  .mic:hover { color: var(--err); }
  .svg { margin-left: 8px; }
  #msg { min-height: 20px; font-size: 13.5px; margin: 0 0 10px; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
  footer { color: var(--mut); font-size: 12.5px; border-top: 1px solid var(--line); margin-top: 20px; padding-top: 12px; }
  .hidden { display: none !important; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px;
          border: 1px solid var(--line); color: var(--mut); }
  .chip-new { border-color: var(--acc2); color: var(--acc2); }
</style>

</head>
<body class="wb">
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/dashboard" title="Tableau de bord" style="text-decoration:none;color:inherit">
      <img src="/branding/logo" alt="Lords of the Pit" class="crest">
      <div>
        <div class="brandname">LOTP <span>Préparation de raid</span></div>
        <div class="tagline">Ce que la guilde fabrique pour les raids — compos nécessaires et apports de chacun.</div>
      </div>
    </a>
    <div class="userbox">
      <span class="who" id="who"></span>
      <a class="hlink" href="/settings">⚙️ Paramètres</a>
      <a class="hlink" href="#" id="logout">Déconnexion</a>
    </div>
  </header>
  <nav class="tabs" id="navmain"></nav>
  <div id="msg"></div>

  <div class="card">
    <h2>🛠️ À fabriquer <span class="pc" id="itemsmeta"></span></h2>
    <div id="items"><div class="empty">Chargement…</div></div>
    <div id="itemsedit" class="hidden" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px">
      <div class="row">
        <span class="combo">
          <input id="inew" placeholder="Rechercher une recette… (tape pour filtrer)" autocomplete="off">
          <div id="inlist" class="inlist hidden"></div>
        </span>
        <input id="iqty" type="number" min="1" step="1" value="1" style="width:90px" title="Combien en fabriquer">
        <button class="btn" id="iadd">＋ Ajouter</button>
      </div>
      <div class="meta" id="inewprev" style="margin-top:4px"></div>
      <label class="chkline"><input type="checkbox" id="inguild"> Seulement les recettes connues par les joueurs de la guilde</label>
      <div class="row" style="margin-top:6px">
        <span class="meta" id="gsyncmeta"></span>
        <button class="btn ghost" id="objreset" title="Vide le plan et les apports (les recettes sont gardées)">♻️ Réinitialiser</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧾 Compos nécessaires <span class="pc" id="needsmeta"></span></h2>
    <div id="needs"><div class="empty">Chargement…</div></div>
  </div>

  <footer><span id="ver"></span> · Moteur : SimulationCraft · Outil non affilié à Blizzard Entertainment</footer>
</div>
<script src="/static/nav.js?v=2026.09.129"></script>
<script src="/static/branding.js?v=2026.09.129"></script>
<script src="/static/i18n.js?v=2026.09.129"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const fmt = (n, d = 0) => n == null ? "—" : new Intl.NumberFormat("fr-FR", { maximumFractionDigits: d }).format(n);
const ago = (ts) => { if (!ts) return "—"; const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return `il y a ${Math.floor(s / 86400)} j`; };
const jget = async (u) => { const r = await fetch(u);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.detail || "Erreur API"); err.status = r.status; throw err; } return j; };
const jpost = async (m, u, b) => { const r = await fetch(u, { method: m, headers: { "Content-Type": "application/json" },
    body: b === undefined ? undefined : JSON.stringify(b) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.detail || "Erreur API"); err.status = r.status; throw err; } return j; };
let msgT = null;
function setMsg(txt, ok) { const m = $("#msg"); m.textContent = txt || ""; m.className = txt ? (ok ? "ok" : "err") : "";
  clearTimeout(msgT); if (txt) msgT = setTimeout(() => { m.textContent = ""; m.className = ""; }, 4000); }

let DATA = null, CAN = false;
let PLAN = { title: "", event_ts: 0, items: [], raids: [], bosses: [] };

async function savePlan() {
  try {
    await jpost("POST", "/api/prep/plan", { title: PLAN.title, event_ts: PLAN.event_ts, items: PLAN.items,
      raids: PLAN.raids || [], bosses: PLAN.bosses || [] });
    setMsg("Plan enregistré ✓", true);
    await load();
  } catch (e) { setMsg(e.message, false); }
}

let OPT_MATS = {};        // recette normalisée -> entrée (maison > jeu > artisans)
let OPT_LIST = [];        // toutes les entrées, ordre des sources
let SEL = null;           // entrée choisie dans la liste
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const SRC_TAG = { maison: "🏕️", jeu: "🎮", artisans: "👥" };

let GUILD_ONLY = false;

function buildIndex() {
  const groups = [
    ["maison", (DATA.recipes || []).map(r => ({ item: r.name, prof: "", mats: r.mats, who: [] }))],
    ["jeu", (DATA.game || []).map(g => ({ item: g.item, prof: g.prof, mats: g.mats, who: g.crafters || [] }))],
    ["artisans", (DATA.catalog || []).map(c => ({ item: c.item, prof: c.prof, mats: c.mats, who: c.crafters || [] }))]
  ];
  const cands = {};   // clé -> candidats dans l'ordre de priorité (maison > jeu > artisans)
  for (const [src, rows] of groups) {
    for (const x of rows) {
      const key = norm(x.item);
      if (!key) continue;
      x.src = src;
      (cands[key] = cands[key] || []).push(x);
    }
  }
  OPT_MATS = {}; OPT_LIST = [];
  for (const list of Object.values(cands)) {
    const keep = list[0];
    keep.optMats = list.map(c => c.mats || []).find(m => m.length) || [];       // comme le serveur : 1re source non vide
    keep.optWho = [...new Set(list.flatMap(c => c.who || []))];
    OPT_MATS[norm(keep.item)] = keep;
    OPT_LIST.push(keep);
  }
}

const guildKnown = (x) => (x.optWho || []).length > 0;

function hideInList() { $("#inlist").classList.add("hidden"); }

function renderInList(q) {
  const box = $("#inlist");
  const nq = norm(q);
  const base = GUILD_ONLY ? OPT_LIST.filter(guildKnown) : OPT_LIST;
  let res = [];
  if (nq) {
    const start = [], mid = [];
    for (const x of base) {
      const n = norm(x.item);
      if (n.startsWith(nq)) start.push(x);
      else if (n.includes(nq)) mid.push(x);
    }
    res = start.concat(mid);
  }
  if (!nq) {
    box.innerHTML = GUILD_ONLY
      ? `<div class="inhint">Tape pour filtrer parmi ${base.length} recettes connues de la guilde…</div>`
      : `<div class="inhint">Tape pour filtrer parmi ${base.length} recettes…</div>`;
    box.classList.remove("hidden");
    return;
  }
  if (!res.length) {
    box.innerHTML = `<div class="inhint">Aucun résultat — si le filtre guilde est coché, essaie de le décocher ; sinon, vérifie l'orthographe.</div>`;
    box.classList.remove("hidden");
    return;
  }
  const shown = res.slice(0, 40);
  box.innerHTML = shown.map((x, i) => `<div class="inrow" data-i="${i}">
      <span class="im">${esc(x.item)}</span>
      <span class="meta">${SRC_TAG[x.src] || ""} ${esc(x.prof || "")}</span>
      ${(x.optMats || []).length ? "" : `<span class="meta">⚠️</span>`}
    </div>`).join("") + (res.length > shown.length ? `<div class="inhint">… ${res.length - shown.length} autres — affine ta recherche.</div>` : "");
  box.classList.remove("hidden");
  window._inRes = shown;
  window._inSel = -1;
  box.querySelectorAll("[data-i]").forEach(r => {
    r.addEventListener("mousedown", (ev) => ev.preventDefault());
    r.addEventListener("click", () => pickIn(shown[+r.dataset.i]));
  });
}

function showPrev(x) {
  const p = $("#inewprev");
  if (!x) { p.textContent = ""; return; }
  if (!(x.optMats || []).length) {
    p.textContent = "⚠️ Compos inconnues pour cette recette (données du jeu incomplètes) — elles apparaîtront dès qu'un artisan de la guilde importera son export d'addon (🙋 Moi → 📖 Mes recettes).";
    return;
  }
  const mats = x.optMats.map(m => `${m.name} ×${fmt(m.qty)}`).join(" · ");
  p.textContent = `Compos : ${mats}` + ((x.optWho || []).length ? ` · qui : ${x.optWho.join(", ")}` : "");
}

function pickIn(x) {
  if (!x) return;
  SEL = x;
  $("#inew").value = x.item;
  showPrev(x);
  hideInList();
}

function currentEntry() {
  const typed = ($("#inew").value || "").trim();
  if (SEL && SEL.item.toLowerCase() === typed.toLowerCase()) return SEL;
  if (!typed) return null;
  const exact = OPT_MATS[norm(typed)];
  if (exact) return exact;
  const res = window._inRes || [];
  return res.length === 1 ? res[0] : null;
}

function renderItems() {
  const box = $("#items");
  const it = PLAN.items || [];
  $("#itemsmeta").textContent = it.length ? `· ${it.length} objet(s)` : "";
  if (!it.length) {
    box.innerHTML = `<div class="empty">Aucun objet dans le plan pour le moment.</div>`;
  } else {
    box.innerHTML = it.map((x, i) => `<div class="irow">
      <span class="iname">${esc(x.name)}</span>
      ${CAN ? `<input type="number" class="oqty" data-qi="${i}" value="${+x.qty || 1}" min="1" step="1" title="Quantité à fabriquer">`
            : `<span class="qty">× ${fmt(x.qty)}</span>`}
      ${CAN ? `<button class="mic" data-ri="${i}" title="Retirer">✕</button>` : ""}
    </div>`).join("");
    if (CAN) box.querySelectorAll("[data-ri]").forEach(b => b.addEventListener("click", async () => {
      PLAN.items.splice(+b.dataset.ri, 1); await savePlan();
    }));
    if (CAN) box.querySelectorAll("[data-qi]").forEach(inp => inp.addEventListener("change", async () => {
      PLAN.items[+inp.dataset.qi].qty = Math.max(1, parseInt(inp.value || "1", 10) || 1);
      await savePlan();
    }));
  }
  $("#itemsedit").classList.toggle("hidden", !CAN);
  buildIndex();
  if (DATA.unknown && DATA.unknown.length) {
    $("#itemsmeta").textContent += ` · ⚠️ sans compos connues : ${DATA.unknown.join(", ")}`;
  }
}

function renderNeeds() {
  const box = $("#needs");
  const needs = DATA.needs || [];
  const total = needs.reduce((a, n) => a + (n.need > 0 ? 1 : 0), 0);
  const done = needs.filter(n => n.need > 0 && n.claimed >= n.need).length;
  $("#needsmeta").textContent = total ? `· ${done}/${total} complet${done > 1 ? "s" : ""}` : "";
  if (!needs.length) {
    box.innerHTML = `<div class="empty">Rien à préparer pour le moment.</div>`;
    return;
  }
  box.innerHTML = needs.map(n => {
    const mine = (n.claims || []).find(c => c.mine);
    const bank = +n.bank || 0;
    const claimed = +n.claimed || 0;
    const rest = n.rest != null ? +n.rest : Math.max(0, (n.need || 0) - claimed - bank);
    const cls = n.need > 0 && rest <= 0 ? "ok" : ((claimed + bank) > 0 ? "warn" : "");
    const claimTxt = (n.claims || []).map(c => `${esc(c.name)} ×${fmt(c.qty)}`).join(", ");
    const pct = n.need > 0 ? Math.min(100, Math.round(100 * (claimed + bank) / n.need)) : 0;
    return `<div class="nrow">
      <span class="nmat">${esc(n.mat)}</span>
      <span class="nneed">besoin : ${n.need > 0 ? fmt(n.need) : "—"}</span>
      <span class="nbank">${CAN
        ? `🏦 <input type="number" min="0" step="1" value="${bank ? bank : ""}" data-bank="${esc(n.mat)}" placeholder="0" title="Quantité déjà en banque de guilde">`
        : (bank > 0 ? "🏦 " + fmt(bank) : "")}</span>
      <span class="nclaimed ${cls}">fourni : ${fmt(n.claimed)}${n.need > 0 ? "/" + fmt(n.need) : ""}</span>
      ${n.need > 0 ? `<span class="nrest ${rest <= 0 ? "ok" : ""}">${rest > 0 ? `reste : ${fmt(rest)}` : "✓ complet"}</span>` : ""}
      <span class="napport">
        <input type="number" min="0" step="1" value="${mine ? (mine.qty || "") : ""}" data-mat="${esc(n.mat)}" placeholder="qté" title="Quantité que tu apportes (0 ou vide = retirer ton apport)">
        <button class="btn ghost" data-claim="${esc(n.mat)}">j'apporte</button>
      </span>
      <span class="nclaims">${claimTxt}</span>
      ${n.need > 0 ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
    </div>`;
  }).join("");
  box.querySelectorAll("[data-bank]").forEach(inp => inp.addEventListener("change", async () => {
    const mat = inp.dataset.bank;
    const qty = parseFloat((inp.value || "0").replace(",", ".")) || 0;
    try {
      await jpost("POST", "/api/prep/bank", { mat, qty });
      setMsg(qty > 0 ? `Banque : ${mat} ×${qty} ✓` : `Banque : ${mat} → 0 ✓`, true);
      await load();
    } catch (e) { setMsg(e.message, false); }
  }));
  box.querySelectorAll("[data-claim]").forEach(b => b.addEventListener("click", async () => {
    const mat = b.dataset.claim;
    const inp = box.querySelector(`input[data-mat="${CSS.escape(mat)}"]`);
    const qty = parseFloat((inp.value || "0").replace(",", ".")) || 0;
    try {
      await jpost("POST", "/api/prep/claim", { mat, qty });
      setMsg(qty > 0 ? `Apport enregistré : ${mat} ×${qty} ✓` : `Apport retiré : ${mat}`, true);
      await load();
    } catch (e) { setMsg(e.message, false); }
  }));
}

function scheduleSyncPoll() {
  clearInterval(window._syncT);
  window._syncT = setInterval(async () => {
    await load();
    if (((DATA || {}).game_sync || {}).state !== "running") {
      clearInterval(window._syncT);
      window._syncT = null;
    }
  }, 4000);
}

function renderRecipes() {
  if (!CAN) { $("#gsyncmeta").textContent = ""; return; }
  const gm = $("#gsyncmeta");
  const s = DATA.game_sync || {};
  const n = (DATA.game || []).length;
  if (s.state === "running") gm.textContent = `· ${n} recettes du jeu · synchronisation en cours…${s.total ? ` (${s.done}/${s.total})` : ""}`;
  else if (s.state === "error") gm.textContent = `· ${n} recettes du jeu · erreur de synchro : ${s.error || "?"}`;
  else gm.textContent = `· ${n} recettes du jeu · ` + (s.ts ? `maj ${ago(s.ts)}` : "pas encore synchronisé");
}

async function load() {
  DATA = await jget("/api/prep");
  CAN = !!DATA.can_edit;
  PLAN = { title: DATA.plan.title || "", event_ts: DATA.plan.event_ts || 0,
           items: (DATA.plan.items || []).map(x => ({ name: x.name, qty: +x.qty || 0 })),
           raids: DATA.plan.raids || [], bosses: DATA.plan.bosses || [] };
  renderItems(); renderNeeds(); renderRecipes();
}

$("#logout").addEventListener("click", async (ev) => {
  ev.preventDefault();
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login";
});
$("#inguild").addEventListener("change", () => {
  GUILD_ONLY = $("#inguild").checked;
  renderInList($("#inew").value || "");
});
$("#inew").addEventListener("input", () => {
  SEL = null;
  const v = $("#inew").value;
  renderInList(v);
  const ex = OPT_MATS[norm(v)];
  showPrev(ex && ex.item.toLowerCase() === v.trim().toLowerCase() ? ex : null);
});
$("#inew").addEventListener("focus", () => renderInList($("#inew").value || ""));
$("#inew").addEventListener("blur", () => setTimeout(hideInList, 150));
$("#inew").addEventListener("keydown", (ev) => {
  const box = $("#inlist");
  if (ev.key === "Escape") { hideInList(); return; }
  if (box.classList.contains("hidden")) {
    if (ev.key === "Enter") { ev.preventDefault(); $("#iadd").click(); }
    return;
  }
  const rows = [...box.querySelectorAll(".inrow")];
  if (!rows.length) return;
  let i = (window._inSel != null) ? window._inSel : -1;
  if (ev.key === "ArrowDown") { i = Math.min(rows.length - 1, i + 1); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { i = Math.max(0, i - 1); ev.preventDefault(); }
  else if (ev.key === "Enter") { ev.preventDefault(); pickIn((window._inRes || [])[Math.max(0, i)]); return; }
  else return;
  window._inSel = i;
  rows.forEach((r, j) => r.classList.toggle("sel", j === i));
  rows[i].scrollIntoView({ block: "nearest" });
});
$("#iadd").addEventListener("click", async () => {
  const e = currentEntry();
  const qty = Math.max(1, parseInt($("#iqty").value || "1", 10) || 1);
  if (!e) { setMsg("Choisis une recette dans la liste (tape pour filtrer).", false); return; }
  const found = PLAN.items.find(x => x.name.toLowerCase() === e.item.toLowerCase());
  if (found) found.qty += qty;
  else PLAN.items.push({ name: e.item, qty });
  SEL = null;
  $("#inew").value = ""; $("#iqty").value = "1"; $("#inewprev").textContent = ""; hideInList();
  await savePlan();
});
$("#objreset").addEventListener("click", async () => {
  if (!confirm("Vider le plan et tous les apports ? (les recettes sont conservées)")) return;
  try { await jpost("POST", "/api/prep/reset"); setMsg("Plan réinitialisé ✓", true); await load(); }
  catch (e) { setMsg(e.message, false); }
});

(async () => {
  try {
    const me = await jget("/api/me");
    $("#who").textContent = me.name || me.email;
  } catch (e) { if (e && (e.status === 401 || /connexion requise|non connect/i.test(String((e && e.message) || "")))) { location.href = "/login"; } return; }
  try { const h = await jget("/api/health"); $("#ver").textContent = "v" + h.version; } catch (e) {}
  try {
    await load();
    if (((DATA || {}).game_sync || {}).state === "running") scheduleSyncPoll();
  } catch (e) {
    $("#needs").innerHTML = `<div class="empty">Erreur de chargement : ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
